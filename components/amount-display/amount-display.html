<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinCore Amount Display — reference markup</title>
  <link rel="stylesheet" href="../../tokens/dist/tokens.css">
  <link rel="stylesheet" href="./amount-display.css">
</head>
<body>
  <main>
    <h1>Amount Display reference markup</h1>
    <div style="display: flex; flex-direction: column; gap: 1rem; padding: 2rem;">
      <div class="fc-amount-display fc-amount-display--lg fc-amount-display--positive">
        <span class="fc-amount-display__currency fc-amount-display-currency">$</span>
        <span class="fc-amount-display__value fc-amount-display-value">+2,450.00</span>
      </div>
      <div class="fc-amount-display fc-amount-display--md fc-amount-display--negative">
        <span class="fc-amount-display__currency fc-amount-display-currency">$</span>
        <span class="fc-amount-display__value fc-amount-display-value">-124.50</span>
      </div>
      <div class="fc-amount-display fc-amount-display--sm fc-amount-display--default">
        <span class="fc-amount-display__currency fc-amount-display-currency">$</span>
        <span class="fc-amount-display__value fc-amount-display-value">0.00</span>
      </div>
    </div>
  </main>
</body>
</html>
