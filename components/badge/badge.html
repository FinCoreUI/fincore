<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinCore Badge — reference markup</title>
  <link rel="stylesheet" href="../../tokens/dist/tokens.css">
  <link rel="stylesheet" href="./badge.css">
</head>
<body>
  <main>
    <h1>Badge reference markup</h1>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <span class="fc-badge fc-badge--default">Pending</span>
      <span class="fc-badge fc-badge--success">Completed</span>
      <span class="fc-badge fc-badge--warning">Review Required</span>
      <span class="fc-badge fc-badge--error">Failed</span>
      <span class="fc-badge fc-badge--info">Verified</span>
    </div>
  </main>
</body>
</html>
