<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinCore Balance Card — reference markup</title>
  <link rel="stylesheet" href="../../tokens/dist/tokens.css">
  <link rel="stylesheet" href="./balance-card.css">
</head>
<body>
  <main>
    <h1>Balance Card reference markup</h1>
    <div style="max-width: 400px; padding: 2rem;">
      <section class="fc-balance-card" aria-label="Account Balance">
        <div class="fc-balance-card__header fc-balance-card-header">
          <span class="fc-balance-card__title fc-balance-card-title">Checking Account</span>
          <span class="fc-balance-card__account fc-balance-card-account">•••• 4242</span>
        </div>
        <div class="fc-balance-card__amount fc-balance-card-amount">
          <span style="font-size: 24px; font-weight: 600;">$14,250.80</span>
        </div>
        <div class="fc-balance-card__footer fc-balance-card-footer">
          <span style="font-size: 12px; color: #525252;">Available to spend</span>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
