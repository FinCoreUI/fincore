<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinCore Card — reference markup</title>
  <link rel="stylesheet" href="../../tokens/dist/tokens.css">
  <link rel="stylesheet" href="./card.css">
</head>
<body>
  <main>
    <h1>Card reference markup</h1>
    <p>A native card container with optional header, body, and footer areas.</p>

    <div class="fc-card">
      <div class="fc-card__header">
        <h2 class="fc-card__title">Card title</h2>
        <p class="fc-card__description">Card description and supporting metadata.</p>
      </div>
      <div class="fc-card__body">
        <p>Main content area inside the card container.</p>
      </div>
      <div class="fc-card__footer">
        <p>Footer actions and notes.</p>
      </div>
    </div>
  </main>
</body>
</html>
