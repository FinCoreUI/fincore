<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinCore Divider — reference markup</title>
  <link rel="stylesheet" href="../../tokens/dist/tokens.css">
  <link rel="stylesheet" href="./divider.css">
</head>
<body>
  <main>
    <h1>Divider reference markup</h1>
    <div>
      <p>Top section</p>
      <hr class="fc-divider fc-divider--horizontal" />
      <p>Bottom section</p>
      <div style="display: flex; height: 40px; align-items: center;">
        <span>Left</span>
        <div class="fc-divider fc-divider--vertical" role="separator" aria-orientation="vertical"></div>
        <span>Right</span>
      </div>
    </div>
  </main>
</body>
</html>
