<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinCore Drawer — reference markup</title>
  <link rel="stylesheet" href="../../tokens/dist/tokens.css">
  <link rel="stylesheet" href="./drawer.css">
</head>
<body>
  <main>
    <h1>Drawer reference markup</h1>
    <div class="fc-drawer-overlay"></div>
    <div class="fc-drawer" role="dialog" aria-modal="true">
      <div class="fc-drawer__header fc-drawer-header">
        <h2 class="fc-drawer__title fc-drawer-title">Filter Transactions</h2>
        <p class="fc-drawer__description fc-drawer-description">Refine transaction list</p>
      </div>
      <div class="fc-drawer__body fc-drawer-body">
        <p>Custom date range and account filters.</p>
      </div>
      <div class="fc-drawer__footer fc-drawer-footer">
        <button type="button" class="fc-drawer-close">Apply</button>
      </div>
    </div>
  </main>
</body>
</html>
