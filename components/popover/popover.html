<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinCore Popover — reference markup</title>
  <link rel="stylesheet" href="../../tokens/dist/tokens.css">
  <link rel="stylesheet" href="./popover.css">
</head>
<body>
  <main>
    <h1>Popover reference markup</h1>
    <div style="padding: 2rem;">
      <div class="fc-popover" role="dialog" aria-modal="false">
        <p style="margin: 0; font-weight: 500;">Payment Details</p>
        <p style="margin: 0.5rem 0 0; color: #71717a;">Recurring monthly debit on the 1st of each month.</p>
        <button type="button" class="fc-popover-close">Close</button>
        <div class="fc-popover-arrow"></div>
      </div>
    </div>
  </main>
</body>
</html>
