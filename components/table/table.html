<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinCore Table — reference markup</title>
  <link rel="stylesheet" href="../../tokens/dist/tokens.css">
  <link rel="stylesheet" href="./table.css">
</head>
<body>
  <main>
    <h1>Table reference markup</h1>
    <div class="fc-table-container">
      <table class="fc-table">
        <thead class="fc-table__header">
          <tr>
            <th class="fc-table__th">Transaction ID</th>
            <th class="fc-table__th">Recipient</th>
            <th class="fc-table__th">Date</th>
            <th class="fc-table__th">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr class="fc-table__row">
            <td class="fc-table__td">TX-98213</td>
            <td class="fc-table__td">Acme Corp</td>
            <td class="fc-table__td">2026-11-06</td>
            <td class="fc-table__td">$1,250.00</td>
          </tr>
          <tr class="fc-table__row">
            <td class="fc-table__td">TX-98214</td>
            <td class="fc-table__td">Global Logistics</td>
            <td class="fc-table__td">2026-11-07</td>
            <td class="fc-table__td">$420.50</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
