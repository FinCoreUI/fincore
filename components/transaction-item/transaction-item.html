<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinCore Transaction Item — reference markup</title>
  <link rel="stylesheet" href="../../tokens/dist/tokens.css">
  <link rel="stylesheet" href="./transaction-item.css">
</head>
<body>
  <main>
    <h1>Transaction Item reference markup</h1>
    <div style="max-width: 480px; padding: 2rem;">
      <div class="fc-transaction-item">
        <div class="fc-transaction-item__lead fc-transaction-item-lead">
          <div class="fc-transaction-item__icon fc-transaction-item-icon">💳</div>
          <div class="fc-transaction-item__content fc-transaction-item-content">
            <span class="fc-transaction-item__title fc-transaction-item-title">Apple Store</span>
            <span class="fc-transaction-item__subtitle fc-transaction-item-subtitle">Electronics • Today 14:32</span>
          </div>
        </div>
        <div class="fc-transaction-item__trail fc-transaction-item-trail">
          <span style="font-weight: 500;">-$999.00</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
